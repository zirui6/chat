<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>连通性测试-开发者工具</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
            background: #0a0a1a;
            color: #e8e8f0;
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }
        .container {
            max-width: 760px;
            width: 100%;
            background: #1a1a2e;
            border-radius: 16px;
            padding: 30px;
            border: 1px solid #2a2a45;
            margin-top: 20px;
        }
        h1 { font-size: 24px; margin-bottom: 8px; display: flex; align-items: center; gap: 10px; }
        .subtitle { color: #8a8aaa; font-size: 14px; margin-bottom: 24px; }
        
        .status-bar {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            background: #222240;
            border-radius: 8px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            flex-shrink: 0;
        }
        .status-dot.online { background: #22c55e; }
        .status-dot.offline { background: #ef4444; }
        .status-dot.testing { background: #f59e0b; animation: blink 0.8s infinite; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
        .status-text { font-size: 14px; color: #a0a0c0; }
        .status-text strong { color: #e8e8f0; }

        .form-group { margin-bottom: 14px; }
        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #a0a0c0;
            margin-bottom: 4px;
        }
        .form-group input, .form-group textarea, .form-group select {
            width: 100%;
            padding: 10px 14px;
            background: #222240;
            border: 1px solid #2a2a45;
            border-radius: 8px;
            color: #e8e8f0;
            font-size: 14px;
            outline: none;
            transition: all 0.3s;
            font-family: inherit;
        }
        .form-group input:focus, .form-group textarea:focus {
            border-color: #4a6cf7;
            box-shadow: 0 0 0 3px rgba(74, 108, 247, 0.15);
        }
        .form-group textarea { resize: vertical; min-height: 60px; }
        .form-group .hint { font-size: 12px; color: #666688; margin-top: 4px; }
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }
        @media (max-width: 480px) { .form-row { grid-template-columns: 1fr; } }

        .btn-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin: 16px 0;
        }
        .btn {
            padding: 10px 24px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            color: #fff;
        }
        .btn:hover { opacity: 0.85; transform: translateY(-1px); }
        .btn-primary { background: #4a6cf7; }
        .btn-success { background: #22c55e; }
        .btn-danger { background: #ef4444; }
        .btn-warning { background: #f59e0b; }
        .btn-secondary { background: #2a2a4a; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

        .result-box {
            background: #222240;
            border-radius: 8px;
            padding: 16px;
            margin-top: 16px;
            max-height: 350px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 13px;
            white-space: pre-wrap;
            word-break: break-all;
            border: 1px solid #2a2a45;
        }
        .result-box.success { border-color: #22c55e; }
        .result-box.error { border-color: #ef4444; }

        .user-info {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            background: #222240;
            border-radius: 8px;
            margin-bottom: 16px;
            border-left: 3px solid #4a6cf7;
        }
        .user-info img { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; }
        .user-info .name { font-weight: 600; }
        .user-info .id { font-size: 12px; color: #666688; }

        .preset-btns {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-bottom: 12px;
        }
        .preset-btns button {
            padding: 4px 12px;
            background: #222240;
            border: 1px solid #2a2a45;
            border-radius: 4px;
            color: #a0a0c0;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .preset-btns button:hover { border-color: #4a6cf7; color: #e8e8f0; }

        .log-entry { padding: 4px 0; border-bottom: 1px solid #1a1a2e; }
        .log-entry:last-child { border-bottom: none; }
        .log-entry .time { color: #666688; font-size: 12px; }
        .log-entry .level { font-weight: 600; margin: 0 6px; }
        .log-entry .level.info { color: #4a6cf7; }
        .log-entry .level.success { color: #22c55e; }
        .log-entry .level.error { color: #ef4444; }

        .empty-state { text-align: center; padding: 30px 0; color: #666688; }
        .empty-state .icon { font-size: 48px; margin-bottom: 12px; }

        .tag-public {
            display: inline-block;
            padding: 2px 10px;
            background: #4a6cf7;
            border-radius: 12px;
            font-size: 11px;
            color: #fff;
            font-weight: 600;
        }
        .tag-private {
            display: inline-block;
            padding: 2px 10px;
            background: #f59e0b;
            border-radius: 12px;
            font-size: 11px;
            color: #fff;
            font-weight: 600;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🧪 Supabase 连通性测试</h1>
    <p class="subtitle">手动输入数据，测试与 Supabase 的连接（支持公共/私密消息）</p>

    <!-- 状态栏 -->
    <div class="status-bar">
        <span class="status-dot" id="statusDot"></span>
        <span class="status-text" id="statusText">⏳ 检查连接...</span>
        <span style="flex:1;"></span>
        <button class="btn btn-secondary" onclick="testConnection()" style="padding:4px 12px;font-size:12px;">
            🔄 测试连接
        </button>
    </div>

    <!-- 用户信息 -->
    <div id="userInfoArea" style="display:none;">
        <div class="user-info" id="userInfo">
            <img id="userAvatar" src="https://zirui6.github.io/touxiang.jpg" alt="" />
            <div>
                <div class="name" id="userNameDisplay">用户</div>
                <div class="id" id="userIdDisplay">ID: -</div>
            </div>
            <span style="flex:1;"></span>
            <button class="btn btn-secondary" onclick="logout()" style="padding:4px 12px;font-size:12px;">
                🚪 退出
            </button>
        </div>
    </div>

    <!-- 表单 -->
    <form id="testForm" onsubmit="submitData(event)">
        <div class="form-group">
            <label>📝 内容 <span style="color:#ef4444;">*</span></label>
            <textarea id="contentInput" placeholder="输入测试消息内容..." required>🧪 测试消息 - 手动上传</textarea>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label>👤 发送者 <span style="color:#ef4444;">*</span></label>
                <input type="text" id="senderNameInput" placeholder="输入你的名字" required />
            </div>
            <div class="form-group">
                <label>🆔 发送者ID <span style="color:#ef4444;">*</span></label>
                <input type="text" id="senderIdInput" placeholder="输入你的用户ID" required />
                <div class="hint">💡 从 user.html 获取，或任意输入测试ID</div>
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label>📥 接收者ID <span style="color:#666688;">（可选）</span></label>
                <input type="text" id="receiverIdInput" placeholder="留空 = 公共消息" />
                <div class="hint">💡 留空则所有人都能看到（公共区）</div>
            </div>
            <div class="form-group">
                <label>🖼️ 头像URL（选填）</label>
                <input type="text" id="avatarInput" placeholder="https://example.com/avatar.jpg" />
            </div>
        </div>

        <!-- 预设快捷输入 -->
        <div class="preset-btns">
            <span style="color:#666688;font-size:12px;padding:4px 0;">快速填充：</span>
            <button onclick="fillPreset('test1')">测试1</button>
            <button onclick="fillPreset('test2')">测试2</button>
            <button onclick="fillPreset('test3')">测试3</button>
            <button onclick="fillPreset('public')">🌐 公共消息</button>
            <button onclick="fillPreset('private')">🔒 私密消息</button>
            <button onclick="fillFromUser()">👤 从登录获取</button>
        </div>

        <div class="btn-group">
            <button type="submit" class="btn btn-success" id="submitBtn">
                📤 上传到 Supabase
            </button>
            <button type="button" class="btn btn-primary" onclick="testRead()">
                📥 读取数据
            </button>
            <button type="button" class="btn btn-secondary" onclick="clearLogs()">
                🗑️ 清空日志
            </button>
        </div>
    </form>

    <!-- 结果显示 -->
    <div id="resultBox" class="result-box">
        <div class="empty-state">
            <div class="icon">📋</div>
            <p>等待操作...</p>
            <p style="font-size:12px;">上传或读取数据后，结果将显示在这里</p>
        </div>
    </div>
</div>

<script>
// ============================================================
// 配置
// ============================================================
const SUPABASE_URL = 'https://uigzsxmkulephkfkiebj.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_OgyvGDiFuFAKKGYMmnq3GA_nXqIRCmW';

// ============================================================
// DOM 引用
// ============================================================
const $ = id => document.getElementById(id);
const statusDot = $('statusDot');
const statusText = $('statusText');
const resultBox = $('resultBox');
const contentInput = $('contentInput');
const senderNameInput = $('senderNameInput');
const senderIdInput = $('senderIdInput');
const receiverIdInput = $('receiverIdInput');
const avatarInput = $('avatarInput');
const submitBtn = $('submitBtn');
const userInfoArea = $('userInfoArea');

// ============================================================
// 日志系统
// ============================================================
let logs = [];

function addLog(message, level = 'info') {
    const time = new Date().toLocaleTimeString();
    logs.push({ time, message, level });
    renderLogs();
}

function renderLogs() {
    if (logs.length === 0) {
        resultBox.innerHTML = `
            <div class="empty-state">
                <div class="icon">📋</div>
                <p>等待操作...</p>
                <p style="font-size:12px;">上传或读取数据后，结果将显示在这里</p>
            </div>
        `;
        resultBox.className = 'result-box';
        return;
    }

    resultBox.innerHTML = logs.map(log => `
        <div class="log-entry">
            <span class="time">${log.time}</span>
            <span class="level ${log.level}">[${log.level.toUpperCase()}]</span>
            <span>${log.message}</span>
        </div>
    `).join('');
    resultBox.scrollTop = resultBox.scrollHeight;
}

function clearLogs() {
    logs = [];
    renderLogs();
    resultBox.className = 'result-box';
}

// ============================================================
// 预设填充
// ============================================================
function fillPreset(name) {
    const now = new Date().toLocaleString();
    const presets = {
        test1: {
            content: '🧪 测试数据 1 - ' + now,
            senderName: '测试用户A',
            senderId: 'test_user_001',
            receiverId: '',
            avatar: 'https://i.pravatar.cc/150?img=1'
        },
        test2: {
            content: '🧪 测试数据 2 - ' + now,
            senderName: '测试用户B',
            senderId: 'test_user_002',
            receiverId: '',
            avatar: 'https://i.pravatar.cc/150?img=2'
        },
        test3: {
            content: '🧪 测试数据 3 - ' + now,
            senderName: '测试用户C',
            senderId: 'test_user_003',
            receiverId: '',
            avatar: 'https://i.pravatar.cc/150?img=3'
        },
        public: {
            content: '🌐 公共消息 - ' + now,
            senderName: '公共用户',
            senderId: 'public_user_' + Date.now(),
            receiverId: '',
            avatar: 'https://i.pravatar.cc/150?img=4'
        },
        private: {
            content: '🔒 私密消息 - ' + now,
            senderName: '私密用户',
            senderId: 'private_user_' + Date.now(),
            receiverId: 'target_user_001',
            avatar: 'https://i.pravatar.cc/150?img=5'
        }
    };

    const p = presets[name];
    if (!p) return;

    contentInput.value = p.content;
    senderNameInput.value = p.senderName;
    senderIdInput.value = p.senderId;
    receiverIdInput.value = p.receiverId || '';
    if (p.avatar) avatarInput.value = p.avatar;

    const type = p.receiverId ? '🔒 私密' : '🌐 公共';
    addLog(`✅ 已填充预设: ${name} (${type})`, 'success');
}

function fillFromUser() {
    try {
        const data = localStorage.getItem('chat_user_data');
        if (data) {
            const user = JSON.parse(data);
            if (user && user.id) {
                senderNameInput.value = user.username || user.display_name || '用户';
                senderIdInput.value = user.id;
                if (user.avatar_url) avatarInput.value = user.avatar_url;
                addLog(`✅ 从登录信息填充: ${user.username} (${user.id})`, 'success');
                return;
            }
        }
        addLog('❌ 未找到登录信息，请先登录 user.html', 'error');
    } catch (e) {
        addLog('❌ 读取登录信息失败: ' + e.message, 'error');
    }
}

// ============================================================
// 从 localStorage 加载用户信息
// ============================================================
function loadUserInfo() {
    try {
        const data = localStorage.getItem('chat_user_data');
        if (data) {
            const user = JSON.parse(data);
            if (user && user.id) {
                $('userAvatar').src = user.avatar_url || 'https://zirui6.github.io/touxiang.jpg';
                $('userNameDisplay').textContent = user.username || user.display_name || '用户';
                $('userIdDisplay').textContent = 'ID: ' + user.id;
                userInfoArea.style.display = 'block';
                
                senderNameInput.value = user.username || user.display_name || '用户';
                senderIdInput.value = user.id;
                if (user.avatar_url) avatarInput.value = user.avatar_url;
                
                return user;
            }
        }
        userInfoArea.style.display = 'none';
        return null;
    } catch (e) {
        console.error('加载用户失败:', e);
        userInfoArea.style.display = 'none';
        return null;
    }
}

// ============================================================
// 测试连接
// ============================================================
async function testConnection() {
    statusDot.className = 'status-dot testing';
    statusText.innerHTML = '⏳ 测试连接中...';
    addLog('🔄 开始测试 Supabase 连接...', 'info');

    try {
        const response = await fetch(SUPABASE_URL + '/rest/v1/messages?limit=1', {
            headers: {
                'apikey': SUPABASE_ANON_KEY,
                'Authorization': 'Bearer ' + SUPABASE_ANON_KEY
            }
        });

        if (response.ok) {
            statusDot.className = 'status-dot online';
            statusText.innerHTML = '✅ 连接正常 - 响应: ' + response.status;
            addLog('✅ Supabase 连接成功! 状态码: ' + response.status, 'success');
        } else {
            statusDot.className = 'status-dot offline';
            statusText.innerHTML = '❌ 连接异常 - 状态: ' + response.status;
            addLog('❌ Supabase 连接失败: ' + response.status + ' ' + response.statusText, 'error');
        }
    } catch (error) {
        statusDot.className = 'status-dot offline';
        statusText.innerHTML = '❌ 网络错误';
        addLog('❌ 连接错误: ' + error.message, 'error');
    }
}

// ============================================================
// 上传数据到 Supabase
// ============================================================
async function submitData(event) {
    event.preventDefault();

    const content = contentInput.value.trim();
    const senderName = senderNameInput.value.trim();
    const senderId = senderIdInput.value.trim();
    const receiverId = receiverIdInput.value.trim() || null;
    const avatar = avatarInput.value.trim() || 'https://zirui6.github.io/touxiang.jpg';

    if (!content || !senderName || !senderId) {
        addLog('❌ 请填写完整信息（内容、发送者、发送者ID）', 'error');
        return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = '⏳ 上传中...';

    const isPublic = !receiverId;
    const data = {
        content: content,
        sender_id: senderId,
        sender_name: senderName,
        receiver_id: receiverId,
        sender_avatar: avatar,
        created_at: new Date().toISOString()
    };

    const typeLabel = isPublic ? '🌐 公共' : '🔒 私密(目标: ' + receiverId + ')';
    addLog('📤 正在上传数据... (' + typeLabel + ')', 'info');
    addLog('📊 数据: ' + JSON.stringify(data, null, 2), 'info');

    try {
        const response = await fetch(SUPABASE_URL + '/rest/v1/messages', {
            method: 'POST',
            headers: {
                'apikey': SUPABASE_ANON_KEY,
                'Authorization': 'Bearer ' + SUPABASE_ANON_KEY,
                'Content-Type': 'application/json',
                'Prefer': 'return=representation'
            },
            body: JSON.stringify(data)
        });

        if (response.ok) {
            const result = await response.json();
            addLog('✅ 上传成功! 数据已保存到 Supabase (' + typeLabel + ')', 'success');
            addLog('📊 返回数据: ' + JSON.stringify(result, null, 2), 'info');
            statusDot.className = 'status-dot online';
            statusText.innerHTML = '✅ 上传成功 (' + typeLabel + ')';
        } else {
            const errorText = await response.text();
            addLog('❌ 上传失败: ' + response.status + ' - ' + errorText, 'error');
            statusDot.className = 'status-dot offline';
            statusText.innerHTML = '❌ 上传失败';
        }
    } catch (error) {
        addLog('❌ 网络错误: ' + error.message, 'error');
        statusDot.className = 'status-dot offline';
        statusText.innerHTML = '❌ 网络错误';
    }

    submitBtn.disabled = false;
    submitBtn.textContent = '📤 上传到 Supabase';
}

// ============================================================
// 读取数据
// ============================================================
async function testRead() {
    addLog('📥 正在读取数据...', 'info');

    try {
        const response = await fetch(SUPABASE_URL + '/rest/v1/messages?order=created_at.desc&limit=50', {
            headers: {
                'apikey': SUPABASE_ANON_KEY,
                'Authorization': 'Bearer ' + SUPABASE_ANON_KEY
            }
        });

        if (response.ok) {
            const data = await response.json();
            addLog('✅ 读取成功! 共 ' + data.length + ' 条记录', 'success');
            
            if (data.length > 0) {
                // 显示每条消息的类型
                data.forEach((msg, index) => {
                    const type = msg.receiver_id ? '🔒 私密' : '🌐 公共';
                    const info = msg.receiver_id ? ' → ' + msg.receiver_id : ' (公共)';
                    addLog(`  ${index+1}. ${type} | ${msg.sender_name}: ${msg.content.substring(0, 30)}${info}`, 'info');
                });
                addLog('📊 最新数据详情: ' + JSON.stringify(data[0], null, 2), 'info');
            } else {
                addLog('📊 暂无数据', 'info');
            }
            statusDot.className = 'status-dot online';
            statusText.innerHTML = '✅ 读取成功 - ' + data.length + ' 条';
        } else {
            const errorText = await response.text();
            addLog('❌ 读取失败: ' + response.status + ' - ' + errorText, 'error');
            statusDot.className = 'status-dot offline';
            statusText.innerHTML = '❌ 读取失败';
        }
    } catch (error) {
        addLog('❌ 网络错误: ' + error.message, 'error');
        statusDot.className = 'status-dot offline';
        statusText.innerHTML = '❌ 网络错误';
    }
}

// ============================================================
// 退出
// ============================================================
function logout() {
    localStorage.removeItem('chat_user_data');
    localStorage.removeItem('auth_token');
    sessionStorage.clear();
    userInfoArea.style.display = 'none';
    addLog('🚪 已退出登录', 'info');
    statusText.innerHTML = '⏳ 已退出';
    statusDot.className = 'status-dot';
}

// ============================================================
// 初始化
// ============================================================
function init() {
    addLog('🚀 测试页面已加载', 'info');
    addLog('📋 Supabase URL: ' + SUPABASE_URL, 'info');

    loadUserInfo();
    setTimeout(testConnection, 500);
}

document.addEventListener('DOMContentLoaded', init);
</script>

</body>
</html>
