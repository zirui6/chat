<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>用户信息同步</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
            background: #0a0a1a;
            color: #e8e8f0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            background: #1a1a2e;
            border-radius: 16px;
            padding: 40px;
            max-width: 480px;
            width: 100%;
            text-align: center;
            border: 1px solid #2a2a45;
        }
        .icon { font-size: 56px; margin-bottom: 16px; }
        h2 { font-size: 22px; margin-bottom: 8px; }
        p { color: #8a8aaa; font-size: 14px; margin-bottom: 20px; }
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #2a2a45;
            border-top-color: #4a6cf7;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .user-card {
            background: #222240;
            border-radius: 12px;
            padding: 20px;
            margin: 16px 0;
            text-align: left;
        }
        .user-card .row {
            display: flex;
            justify-content: space-between;
            padding: 6px 0;
            border-bottom: 1px solid #2a2a45;
            font-size: 14px;
        }
        .user-card .row:last-child { border-bottom: none; }
        .user-card .label { color: #8a8aaa; }
        .user-card .value { color: #e8e8f0; font-weight: 500; }
        .btn {
            display: inline-block;
            padding: 12px 32px;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin: 4px;
        }
        .btn:hover { opacity: 0.85; }
        .btn-primary { background: #4a6cf7; }
        .btn-success { background: #22c55e; }
        .btn-secondary { background: #2a2a4a; }
        .hidden { display: none; }
        .error { color: #ef4444; background: #2d1a1a; padding: 12px; border-radius: 8px; margin: 12px 0; }
        .success { color: #22c55e; background: #1a2d1a; padding: 12px; border-radius: 8px; margin: 12px 0; }
    </style>
</head>
<body>
<div class="container">
    <div class="icon">🔗</div>
    <h2>用户信息同步</h2>
    <p id="statusText">正在获取用户信息...</p>
    <div id="loadingState"><div class="spinner"></div></div>
    <div id="resultArea" class="hidden">
        <div id="messageBox"></div>
        <div id="userCard" class="user-card hidden">
            <div class="row"><span class="label">🆔 用户ID</span><span class="value" id="userId">-</span></div>
            <div class="row"><span class="label">👤 用户名</span><span class="value" id="userName">-</span></div>
            <div class="row"><span class="label">📧 邮箱</span><span class="value" id="userEmail">-</span></div>
        </div>
        <div>
            <button class="btn btn-success" id="syncBtn">💬 进入聊天</button>
            <button class="btn btn-secondary" id="retryBtn">🔄 重试</button>
        </div>
    </div>
</div>
<script>
    const statusText = document.getElementById('statusText');
    const loadingState = document.getElementById('loadingState');
    const resultArea = document.getElementById('resultArea');
    const messageBox = document.getElementById('messageBox');
    const userCard = document.getElementById('userCard');
    const userIdEl = document.getElementById('userId');
    const userNameEl = document.getElementById('userName');
    const userEmailEl = document.getElementById('userEmail');
    const syncBtn = document.getElementById('syncBtn');
    const retryBtn = document.getElementById('retryBtn');

    let userData = null;

    // 从 URL 获取用户数据
    function getUserFromURL() {
        const params = new URLSearchParams(window.location.search);
        const userParam = params.get('user');
        if (userParam) {
            try {
                const data = JSON.parse(decodeURIComponent(userParam));
                if (data && data.id) return data;
            } catch (e) {}
        }
        return null;
    }

    function displayUser(user) {
        userData = user;
        userIdEl.textContent = user.id || '-';
        userNameEl.textContent = user.username || user.display_name || '-';
        userEmailEl.textContent = user.email || '-';
        userCard.classList.remove('hidden');
        statusText.textContent = '✅ 获取成功！';
        statusText.style.color = '#22c55e';
        loadingState.classList.add('hidden');
        resultArea.classList.remove('hidden');
        messageBox.className = 'success';
        messageBox.textContent = '✅ 用户信息获取成功！';
        messageBox.style.display = 'block';
    }

    function showError(msg) {
        statusText.textContent = '❌ 获取失败';
        statusText.style.color = '#ef4444';
        loadingState.classList.add('hidden');
        resultArea.classList.remove('hidden');
        messageBox.className = 'error';
        messageBox.textContent = '❌ ' + msg;
        messageBox.style.display = 'block';
    }

    // 同步并跳转到聊天
    function syncAndGo() {
        if (!userData) return;
        // 保存到 localStorage
        localStorage.setItem('chat_user_data', JSON.stringify(userData));
        if (userData.token) localStorage.setItem('auth_token', userData.token);
        // 跳转到聊天
        window.location.href = 'index.html';
    }

    function init() {
        const user = getUserFromURL();
        if (user) {
            console.log('✅ 获取到用户:', user);
            displayUser(user);
        } else {
            showError('未找到用户信息，请先登录');
            // 跳转到 user.html
            setTimeout(() => {
                window.location.href = '../user.html';
            }, 2000);
        }
    }

    syncBtn.addEventListener('click', syncAndGo);
    retryBtn.addEventListener('click', function() {
        window.location.reload();
    });

    init();
</script>
</body>
</html>
