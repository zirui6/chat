<!DOCTYPE html>
<html lang="zh-CN" id="htmlRoot">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>梓睿聊天 · 手机版</title>
    <link rel="stylesheet" href="phone.css" />
</head>
<body>

    <!-- ===== 未登录遮罩 ===== -->
    <div id="loginOverlay">
        <div class="login-box">
            <div class="login-icon">🔒</div>
            <h2>未登录</h2>
            <p>请先登录梓睿账号</p>
            <button class="btn-login" onclick="goToLogin()">🔑 去登录</button>
            <button class="btn-login test-btn" onclick="goToTest()">🧪 测试入口</button>
        </div>
    </div>

    <!-- ===== Toast ===== -->
    <div class="toast" id="toast"></div>

    <!-- ============================================================ -->
    <!-- 主应用 -->
    <!-- ============================================================ -->
    <div class="app" id="app">
        
        <!-- 主界面（聊天列表） -->
        <div id="mainView" class="view active">
            <!-- 顶部标题 -->
            <div class="main-header">
                <div class="main-title">💬 梓睿聊天</div>
                <div class="main-header-right">
                    <button class="header-btn" onclick="switchToDesktop()" title="桌面版">🖥️</button>
                </div>
            </div>

            <!-- 聊天列表 -->
            <div class="chat-list-container">
                <div class="chat-list" id="chatList">
                    <div class="loading-placeholder">加载中...</div>
                </div>
            </div>

            <!-- 底部导航栏 -->
            <div class="bottom-nav">
                <div class="nav-item active" data-tab="chat" onclick="switchTab('chat')">
                    <span class="nav-icon">💬</span>
                    <span class="nav-label">聊天</span>
                    <span class="nav-badge" id="totalBadge" style="display:none;">0</span>
                </div>
                <div class="nav-item" data-tab="friends" onclick="switchTab('friends')">
                    <span class="nav-icon">👥</span>
                    <span class="nav-label">通讯录</span>
                </div>
                <div class="nav-item" data-tab="profile" onclick="switchTab('profile')">
                    <span class="nav-icon">👤</span>
                    <span class="nav-label">我的</span>
                </div>
                <div class="nav-item" data-tab="settings" onclick="switchTab('settings')">
                    <span class="nav-icon">⚙️</span>
                    <span class="nav-label">设置</span>
                </div>
            </div>
        </div>

        <!-- 聊天详情页 -->
        <div id="chatView" class="view">
            <!-- 顶栏 -->
            <div class="chat-header">
                <button class="back-btn" onclick="closeChat()">‹</button>
                <div class="chat-title" id="chatName">用户</div>
                <button class="header-btn" onclick="showToast('更多功能', 'info')">⋯</button>
            </div>

            <!-- 消息列表 -->
            <div class="message-list" id="messageList">
                <div class="empty-state">
                    <div class="empty-icon">💬</div>
                    <p>暂无消息</p>
                </div>
            </div>

            <!-- 底部输入 -->
            <div class="chat-input-bar">
                <div class="input-tools">
                    <button class="tool-btn" onclick="showToast('表情', 'info')">😊</button>
                    <button class="tool-btn" id="fileBtn" onclick="document.getElementById('fileInput').click()">📎</button>
                    <button class="tool-btn" id="imageBtn" onclick="document.getElementById('imageInput').click()">🖼️</button>
                    <input type="file" id="fileInput" accept="*/*" style="display:none;" />
                    <input type="file" id="imageInput" accept="image/*" style="display:none;" />
                </div>
                <div class="input-row">
                    <textarea id="messageInput" rows="1" placeholder="输入消息..."></textarea>
                    <button class="send-btn" id="sendBtn">发送</button>
                </div>
            </div>
        </div>
    </div>

    <!-- ===== 添加好友弹窗 ===== -->
    <div class="modal-overlay" id="addFriendModal">
        <div class="modal">
            <div class="modal-header">
                <h3>➕ 添加好友</h3>
                <button class="modal-close" onclick="closeAddFriend()">✕</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label>用户ID 或 用户名</label>
                    <input type="text" id="addFriendInput" placeholder="请输入用户ID或用户名" />
                </div>
                <div class="form-group">
                    <label>验证消息（选填）</label>
                    <input type="text" id="addFriendMsg" placeholder="你好，加个好友吧！" />
                </div>
                <button class="btn-primary" id="addFriendSubmit">🔍 搜索并添加</button>
                <div id="searchResults" style="margin-top:12px;"></div>
            </div>
        </div>
    </div>

    <!-- ===== 二维码弹窗 ===== -->
    <div class="modal-overlay" id="qrModal">
        <div class="modal">
            <div class="modal-header">
                <h3>📱 我的二维码</h3>
                <button class="modal-close" onclick="closeQR()">✕</button>
            </div>
            <div class="modal-body" style="text-align:center;">
                <div id="qrcode" style="display:flex;justify-content:center;padding:10px 0;">
                    <div style="width:180px;height:180px;background:#222240;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#666688;">二维码加载中...</div>
                </div>
                <p style="margin-top:12px;font-size:13px;color:#8a8aaa;">
                    用户ID: <strong id="qrUserId">加载中...</strong>
                </p>
                <button class="btn-primary" id="copyIdBtn" style="margin-top:8px;">📋 复制ID</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
