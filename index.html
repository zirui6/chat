<!DOCTYPE html>
<html lang="zh-CN" id="htmlRoot">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>聊天工具</title>
    <link rel="stylesheet" href="style.css" />
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
</head>
<body>

    <!-- ===== 未登录遮罩 ===== -->
    <div id="loginOverlay">
        <div class="icon">🔒</div>
        <h2>该用户未登录</h2>
        <p>请先登录梓睿官网账号</p>
        <button class="btn-login" onclick="openLogin()">🔑 去登录</button>
        <div class="hint">登录后关闭标签页，聊天将自动刷新</div>
    </div>

    <!-- ===== Toast ===== -->
    <div class="toast" id="toast"></div>

    <!-- ===== 主应用 ===== -->
    <div class="app" id="app">

        <!-- ===== 功能栏（最左侧） ===== -->
        <div class="funcbar">
            <div class="logo" onclick="location.reload()" title="刷新">💬</div>

            <button class="func-item active" data-tab="chat" title="聊天">
                💬
                <span class="badge" id="totalBadge" style="display:none;">0</span>
            </button>

            <button class="func-item" data-tab="friends" title="好友">
                👥
            </button>

            <button class="func-item" data-tab="files" title="文件">
                📁
            </button>

            <div class="func-spacer"></div>

            <button class="func-item" data-tab="settings" title="设置">
                ⚙️
            </button>

            <button class="func-item avatar" id="avatarBtn" title="个人中心">
                <img id="myAvatar" src="https://zirui6.github.io/touxiang.jpg" alt="头像" />
            </button>
        </div>

        <!-- ===== 侧边栏（聊天列表） ===== -->
        <div class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="title">💬 聊天</div>
            </div>

            <div class="sidebar-search">
                <input type="text" id="searchInput" placeholder="🔍 搜索..." />
                <button class="btn-icon" id="addFriendBtn" title="添加好友">➕</button>
            </div>

            <div class="chat-list" id="chatList">
                <div style="text-align:center;padding:40px 0;color:var(--text-muted);font-size:14px;">加载中...</div>
            </div>
        </div>

        <!-- ===== 聊天窗口 ===== -->
        <div class="chat-window" id="chatWindow">

            <!-- 空状态 -->
            <div class="empty-state" id="emptyState">
                <div class="icon">💬</div>
                <h3>选择聊天</h3>
                <p>从左侧选择好友开始聊天</p>
            </div>

            <!-- 聊天头部 -->
            <div class="chat-header" id="chatHeader" style="display:none;">
                <div class="user">
                    <img id="chatAvatar" src="https://zirui6.github.io/touxiang.jpg" alt="" />
                    <div>
                        <div class="name" id="chatName">用户</div>
                        <div class="status" id="chatStatus">在线</div>
                    </div>
                </div>
                <div class="actions">
                    <button class="btn-icon" title="更多">⋯</button>
                </div>
            </div>

            <!-- 消息列表 -->
            <div class="message-list" id="messageList">
                <!-- 消息由 JS 动态渲染 -->
            </div>

            <!-- 输入区 -->
            <div class="chat-input" id="chatInput" style="display:none;">
                <div class="tools">
                    <button class="btn-icon" id="emojiBtn" title="表情">😊</button>
                    <button class="btn-icon" id="fileBtn" title="发送文件">📎</button>
                    <button class="btn-icon" id="imageBtn" title="发送图片">🖼️</button>
                    <input type="file" id="fileInput" accept="*/*" style="display:none;" />
                    <input type="file" id="imageInput" accept="image/*" style="display:none;" />
                </div>
                <div class="input-row">
                    <textarea id="messageInput" rows="1" placeholder="输入消息..." maxlength="10000"></textarea>
                    <button class="btn-send" id="sendBtn">发送</button>
                </div>
            </div>
        </div>

    </div>

    <!-- ===== 添加好友弹窗 ===== -->
    <div class="modal-overlay" id="addFriendModal">
        <div class="modal">
            <div class="modal-header">
                <h3>➕ 添加好友</h3>
                <button class="modal-close" id="addFriendModalClose">✕</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label>用户ID 或 用户名</label>
                    <input type="text" id="addFriendInput" placeholder="请输入用户ID或用户名" />
                </div>
                <div class="form-group">
                    <label>验证消息（选填）</label>
                    <input type="text" id="addFriendMsg" placeholder="你好，加个好友吧！" />
                </div>
                <button class="btn-primary" id="addFriendSubmit">🔍 搜索并添加</button>
                <div id="searchResults" style="margin-top:12px;"></div>
            </div>
        </div>
    </div>

    <!-- ===== 二维码弹窗 ===== -->
    <div class="modal-overlay" id="qrModal">
        <div class="modal">
            <div class="modal-header">
                <h3>📱 我的二维码</h3>
                <button class="modal-close" id="qrModalClose">✕</button>
            </div>
            <div class="modal-body" style="text-align:center;">
                <div id="qrcode"></div>
                <p style="margin-top:12px;font-size:13px;color:var(--text-muted);">
                    用户ID: <strong id="qrUserId">加载中...</strong>
                </p>
                <button class="btn-primary" id="copyIdBtn" style="margin-top:8px;">📋 复制ID</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
