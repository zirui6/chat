<!DOCTYPE html>
<html lang="zh-CN" id="htmlRoot">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>梓睿聊天</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>

    <!-- ===== 未登录遮罩 ===== -->
    <div id="loginOverlay">
        <div class="login-box">
            <div class="login-icon">🔒</div>
            <h2>未登录</h2>
            <p>请先登录梓睿账号</p>
            <button class="btn-login" onclick="goToLogin()">🔑 去登录</button>
            <button class="btn-login test-btn" onclick="goToTest()">🧪 测试入口（免登录）</button>
        </div>
    </div>

    <!-- ===== Toast ===== -->
    <div class="toast" id="toast"></div>

    <!-- ===== 主应用 ===== -->
    <div class="app" id="app">

        <!-- ===== 功能栏（左侧） ===== -->
        <div class="funcbar" id="funcbar">
            <div class="logo" onclick="location.reload()" title="刷新">💬</div>

            <button class="func-item active" data-tab="chat" title="聊天" onclick="switchTab('chat')">
                💬
                <span class="badge" id="totalBadge" style="display:none;">0</span>
            </button>

            <button class="func-item" data-tab="friends" title="好友" onclick="switchTab('friends')">
                👥
            </button>

            <button class="func-item" data-tab="files" title="文件" onclick="switchTab('files')">
                📁
            </button>

            <div class="func-spacer"></div>

            <button class="func-item" data-tab="settings" title="设置" onclick="switchTab('settings')">
                ⚙️
            </button>

            <button class="func-item avatar" id="avatarBtn" title="个人中心">
                <img id="myAvatar" src="https://zirui6.github.io/touxiang.jpg" alt="头像" />
            </button>
        </div>

        <!-- ===== 侧边栏 ===== -->
        <div class="sidebar" id="sidebar">
            <!-- 聊天列表 -->
            <div id="sidebarChat">
                <div class="sidebar-header">
                    <div class="title">💬 聊天</div>
                    <div class="sidebar-actions">
                        <button class="sidebar-action-btn" onclick="openAddFriend()" title="添加好友">➕</button>
                        <button class="sidebar-action-btn" onclick="switchTab('settings')" title="设置">⚙️</button>
                    </div>
                </div>
                <div class="sidebar-search">
                    <input type="text" id="searchInput" placeholder="🔍 搜索聊天..." />
                </div>
                <div class="chat-list" id="chatList">
                    <div class="loading-placeholder">加载中...</div>
                </div>
            </div>

            <!-- 好友列表 -->
            <div id="sidebarFriends" style="display:none;">
                <div class="sidebar-header">
                    <div class="title">👥 好友</div>
                    <button class="sidebar-action-btn" onclick="openAddFriend()">➕</button>
                </div>
                <div class="sidebar-search">
                    <input type="text" id="friendSearchInput" placeholder="🔍 搜索好友..." />
                </div>
                <div class="chat-list" id="friendList">
                    <div class="empty-state-sidebar">
                        <div class="empty-icon">👥</div>
                        <p>暂无好友</p>
                        <p class="empty-hint">点击 ➕ 添加好友</p>
                    </div>
                </div>
            </div>

            <!-- 设置 -->
            <div id="sidebarSettings" style="display:none;">
                <div class="sidebar-header">
                    <div class="title">⚙️ 设置</div>
                    <button class="sidebar-action-btn" onclick="switchTab('chat')">✕</button>
                </div>
                <div class="settings-content">
                    <div class="settings-group-title">通用</div>
                    <div class="settings-item" onclick="openTest()">
                        <span class="settings-icon">🧪</span>
                        <div class="settings-info">
                            <div class="settings-name">测试入口</div>
                            <div class="settings-desc">免登录测试聊天</div>
                        </div>
                        <span class="settings-arrow">→</span>
                    </div>
                    <div class="settings-item" onclick="openAddFriend()">
                        <span class="settings-icon">➕</span>
                        <div class="settings-info">
                            <div class="settings-name">添加好友</div>
                            <div class="settings-desc">搜索用户ID或用户名</div>
                        </div>
                        <span class="settings-arrow">→</span>
                    </div>
                    <div class="settings-group-title">外观</div>
                    <div class="settings-item" onclick="toggleTheme()">
                        <span class="settings-icon">🌓</span>
                        <div class="settings-info">
                            <div class="settings-name">切换主题</div>
                            <div class="settings-desc" id="themeStatus">浅色模式</div>
                        </div>
                        <span class="settings-arrow">→</span>
                    </div>
                    <div class="settings-item" onclick="switchToPhone()">
                        <span class="settings-icon">📱</span>
                        <div class="settings-info">
                            <div class="settings-name">切换到手机版</div>
                            <div class="settings-desc">打开手机适配界面</div>
                        </div>
                        <span class="settings-arrow">→</span>
                    </div>
                    <div class="settings-group-title">数据</div>
                    <div class="settings-item" onclick="clearAllData()">
                        <span class="settings-icon">🗑️</span>
                        <div class="settings-info">
                            <div class="settings-name">清除缓存</div>
                            <div class="settings-desc">清除本地消息缓存</div>
                        </div>
                        <span class="settings-arrow">→</span>
                    </div>
                    <div class="settings-item" onclick="logout()" style="border-bottom:none;">
                        <span class="settings-icon">🚪</span>
                        <div class="settings-info">
                            <div class="settings-name" style="color:#ef4444;">退出登录</div>
                            <div class="settings-desc">退出当前账号</div>
                        </div>
                        <span class="settings-arrow">→</span>
                    </div>
                    <div class="settings-footer">
                        <span>版本 2.0</span>
                        <span id="deviceInfo">🖥️ 桌面版</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- ===== 聊天窗口 ===== -->
        <div class="chat-window" id="chatWindow">
            <div class="empty-state" id="emptyState">
                <div class="empty-icon">💬</div>
                <h3>选择聊天</h3>
                <p>从左侧选择好友开始聊天</p>
            </div>

            <div class="chat-header" id="chatHeader" style="display:none;">
                <div class="chat-header-left">
                    <div>
                        <div class="name" id="chatName">用户</div>
                        <div class="status" id="chatStatus">在线</div>
                    </div>
                </div>
                <div class="chat-header-right">
                    <button class="btn-icon" onclick="showToast('更多功能开发中', 'info')">⋯</button>
                </div>
            </div>

            <div class="message-list" id="messageList"></div>

            <div class="chat-input" id="chatInput" style="display:none;">
                <div class="tools">
                    <button class="tool-btn" onclick="showToast('😊 表情功能开发中', 'info')">😊</button>
                    <button class="tool-btn" id="fileBtn" onclick="document.getElementById('fileInput').click()">📎</button>
                    <button class="tool-btn" id="imageBtn" onclick="document.getElementById('imageInput').click()">🖼️</button>
                    <input type="file" id="fileInput" accept="*/*" style="display:none;" />
                    <input type="file" id="imageInput" accept="image/*" style="display:none;" />
                </div>
                <div class="input-row">
                    <textarea id="messageInput" rows="1" placeholder="输入消息..." maxlength="10000"></textarea>
                    <button class="btn-send" id="sendBtn">发送</button>
                </div>
            </div>
        </div>
    </div>

    <!-- ===== 添加好友弹窗 ===== -->
    <div class="modal-overlay" id="addFriendModal">
        <div class="modal">
            <div class="modal-header">
                <h3>➕ 添加好友</h3>
                <button class="modal-close" onclick="closeAddFriend()">✕</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label>用户ID 或 用户名</label>
                    <input type="text" id="addFriendInput" placeholder="请输入用户ID或用户名" />
                </div>
                <div class="form-group">
                    <label>验证消息（选填）</label>
                    <input type="text" id="addFriendMsg" placeholder="你好，加个好友吧！" />
                </div>
                <button class="btn-primary" id="addFriendSubmit">🔍 搜索并添加</button>
                <div id="searchResults" style="margin-top:12px;"></div>
            </div>
        </div>
    </div>

    <!-- ===== 二维码弹窗 ===== -->
    <div class="modal-overlay" id="qrModal">
        <div class="modal">
            <div class="modal-header">
                <h3>📱 我的二维码</h3>
                <button class="modal-close" onclick="closeQR()">✕</button>
            </div>
            <div class="modal-body" style="text-align:center;">
                <div id="qrcode" style="display:flex;justify-content:center;padding:10px 0;">
                    <div style="width:180px;height:180px;background:#222240;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#666688;">二维码加载中...</div>
                </div>
                <p style="margin-top:12px;font-size:13px;color:#8a8aaa;">
                    用户ID: <strong id="qrUserId">加载中...</strong>
                </p>
                <button class="btn-primary" id="copyIdBtn" style="margin-top:8px;">📋 复制ID</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
