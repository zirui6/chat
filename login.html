<!DOCTYPE html>
<html lang="zh-CN" id="htmlRoot" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>登录 · 梓睿聊天</title>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script>
(function () {
  try {
    var d = document.documentElement;
    var t = localStorage.getItem('theme') || 'light';
    var s = null;
    try { s = JSON.parse(localStorage.getItem('chat_settings') || 'null'); } catch (e) {}
    if (s && s.theme) t = s.theme;
    if (t === 'system') {
      t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }
    d.setAttribute('data-theme', t);
  } catch (e) {}
})();
</script>
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

:root {
  --rail-bg:#2e2e2e; --rail-bg-2:#242424;
  --panel-bg:#f7f7f7; --panel-border:#e4e4e4; --search-bg:#ebebeb;
  --pane-bg:#f5f5f5; --card-bg:#ffffff;
  --text:#191919; --text-2:#4a4a4a; --text-3:#8c8c8c; --text-4:#b2b2b2;
  --hover:#e9e9e9; --brand:#07c160; --brand-hover:#06ad56; --danger:#fa5151; --link:#576b95;
  --shadow-panel:0 18px 60px rgba(0,0,0,.22); --shadow-sm:0 1px 3px rgba(0,0,0,.06);
  --input-bg:#ffffff; --input-border:#dcdcdc;
}
[data-theme="dark"] {
  --panel-bg:#1e1e1e; --panel-border:#111111; --search-bg:#2b2b2b;
  --pane-bg:#141414; --card-bg:#2a2a2a;
  --text:#e6e6e6; --text-2:#c2c2c2; --text-3:#8f8f8f; --text-4:#6b6b6b;
  --hover:#2b2b2b; --link:#7d90b8;
  --shadow-panel:0 18px 60px rgba(0,0,0,.6);
  --input-bg:#2a2a2a; --input-border:#3a3a3a;
}

body {
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",Roboto,sans-serif;
  font-size:14px; color:var(--text); min-height:100vh;
  background:var(--pane-bg); display:flex; align-items:center; justify-content:center;
  padding:28px 20px; -webkit-font-smoothing:antialiased;
}

/* ---------- 微信电脑版风格的登录窗口 ---------- */
.login-window {
  display:flex; width:100%; max-width:900px; min-height:520px;
  background:var(--card-bg); border-radius:8px; overflow:hidden;
  box-shadow:var(--shadow-panel); border:1px solid var(--panel-border);
}

/* 左侧深色品牌区 */
.brand-side {
  width:340px; flex-shrink:0; position:relative;
  background:linear-gradient(160deg,var(--rail-bg),var(--rail-bg-2));
  color:#fff; display:flex; flex-direction:column; justify-content:center;
  padding:44px 34px; text-align:center;
}
.brand-side .brand-logo {
  width:82px; height:82px; border-radius:14px; margin:0 auto 18px;
  background:var(--brand); color:#fff; font-size:34px; font-weight:700;
  display:flex; align-items:center; justify-content:center;
  box-shadow:0 12px 32px rgba(7,193,96,.4);
}
.brand-side h1 { font-size:21px; font-weight:600; margin-bottom:10px; letter-spacing:.5px; }
.brand-side p { font-size:13px; color:rgba(255,255,255,.62); line-height:1.7; }
.brand-side .brand-foot {
  margin-top:34px; padding-top:18px; border-top:1px solid rgba(255,255,255,.1);
  font-size:11.5px; color:rgba(255,255,255,.42); line-height:1.8;
}

/* 右侧表单区 */
.form-side { flex:1; min-width:0; display:flex; flex-direction:column; background:var(--card-bg); }
.form-side .fs-head {
  padding:20px 26px 0; display:flex; align-items:center; gap:10px;
}
.form-side .fs-head .fs-title { font-size:15px; font-weight:600; color:var(--text); }
.form-side .fs-head .fs-spacer { flex:1; }
.theme-toggle {
  width:30px; height:30px; border-radius:5px; border:1px solid var(--panel-border);
  background:transparent; color:var(--text-2); cursor:pointer; font-size:14px;
  display:flex; align-items:center; justify-content:center; font-family:inherit;
}
.theme-toggle:hover { border-color:var(--brand); color:var(--brand); }

.form-side .fs-body { flex:1; padding:18px 26px 22px; }

/* Tabs */
.tabs {
  display:flex; gap:4px; background:var(--search-bg); border-radius:6px;
  padding:4px; margin-bottom:20px;
}
.tabs .tab {
  flex:1; padding:9px 0; border:none; background:transparent; border-radius:4px;
  font-size:13.5px; font-weight:500; color:var(--text-2); cursor:pointer;
  font-family:inherit; transition:all .15s ease;
}
.tabs .tab.active { background:var(--card-bg); color:var(--text); box-shadow:var(--shadow-sm); }

.form-panel { display:none; }
.form-panel.active { display:block; animation:fadeIn .22s ease; }
@keyframes fadeIn { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:translateY(0); } }

.form-group { margin-bottom:14px; }
.form-group label {
  display:block; font-size:12.5px; font-weight:600; color:var(--text-2); margin-bottom:6px;
}
.form-group input[type="text"],
.form-group input[type="email"],
.form-group input[type="password"] {
  width:100%; padding:11px 14px; border:1px solid var(--input-border); border-radius:5px;
  font-size:14px; background:var(--input-bg); color:var(--text); outline:none;
  font-family:inherit; transition:border-color .15s ease, box-shadow .15s ease;
}
.form-group input:focus { border-color:var(--brand); box-shadow:0 0 0 3px rgba(7,193,96,.14); }
.form-group input::placeholder { color:var(--text-4); }

.password-wrapper { position:relative; display:flex; align-items:center; }
.password-wrapper input { padding-right:46px !important; }
.toggle-password {
  position:absolute; right:10px; background:none; border:none; cursor:pointer;
  font-size:16px; padding:4px; color:var(--text-3); line-height:1;
}
.toggle-password:hover { color:var(--text); }

.btn-primary {
  width:100%; padding:12px; background:var(--brand); color:#fff; border:none;
  border-radius:5px; font-size:15px; font-weight:600; cursor:pointer; font-family:inherit;
  transition:background .15s ease;
}
.btn-primary:hover { background:var(--brand-hover); }
.btn-primary:disabled { opacity:.6; cursor:not-allowed; }

.btn-secondary {
  width:100%; padding:10px; background:var(--card-bg); color:var(--text-2);
  border:1px solid var(--input-border); border-radius:5px; font-size:13.5px;
  font-weight:500; cursor:pointer; font-family:inherit; transition:all .15s ease;
}
.btn-secondary:hover { border-color:var(--brand); color:var(--brand); }

.social-divider {
  display:flex; align-items:center; gap:14px; margin:16px 0 12px;
  color:var(--text-4); font-size:12.5px;
}
.social-divider::before, .social-divider::after {
  content:''; flex:1; height:1px; background:var(--panel-border);
}

.msg {
  padding:11px 14px; border-radius:5px; font-size:13px; margin-bottom:14px;
  display:none; line-height:1.6; word-break:break-all; border:1px solid transparent;
}
.msg.error { display:block; background:#fdecec; color:#c62828; border-color:#f8d7d7; }
.msg.success { display:block; background:#e9f9ef; color:#0d7a41; border-color:#c9efd8; }
.msg.info { display:block; background:#eaf1fa; color:#0d47a1; border-color:#cfdff2; }
.msg.warning { display:block; background:#fff6e0; color:#8a6100; border-color:#ffe6ad; }
[data-theme="dark"] .msg.error { background:#3a2020; color:#ff9c9c; border-color:#543030; }
[data-theme="dark"] .msg.success { background:#14301f; color:#7fd8a3; border-color:#24462f; }
[data-theme="dark"] .msg.info { background:#1a2a3d; color:#90caf9; border-color:#2a4a6a; }
[data-theme="dark"] .msg.warning { background:#3a3220; color:#ffd479; border-color:#54492a; }

.connection-status {
  display:flex; align-items:center; gap:8px; font-size:12px; color:var(--text-3);
  margin-bottom:16px; padding:8px 12px; background:var(--panel-bg); border-radius:5px;
}
.connection-status .dot { width:9px; height:9px; border-radius:50%; flex-shrink:0; }
.connection-status .dot.checking { background:#ffa726; animation:pulse 1s infinite; }
.connection-status .dot.online { background:var(--brand); }
.connection-status .dot.offline { background:var(--danger); }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }

.existing-session {
  display:none; margin-bottom:16px; padding:12px 14px; border-radius:6px;
  background:var(--panel-bg); border:1px solid var(--panel-border);
}
.existing-session .es-line { font-size:13px; color:var(--text); margin-bottom:9px; }
.existing-session .es-line b { color:var(--brand); font-weight:600; }
.existing-session button {
  width:100%; padding:9px; border-radius:5px; border:none; background:var(--brand);
  color:#fff; font-size:13px; cursor:pointer; font-family:inherit;
}
.existing-session button:hover { background:var(--brand-hover); }

.footer-links {
  display:flex; justify-content:center; gap:22px; padding:14px 26px 18px;
  font-size:12.5px; border-top:1px solid var(--panel-border);
}
.footer-links a { color:var(--text-3); text-decoration:none; transition:color .15s ease; }
.footer-links a:hover { color:var(--brand); }

/* 扫码弹层 */
.scan-modal {
  display:none; position:fixed; inset:0; z-index:9999; padding:24px;
  background:rgba(0,0,0,.85); align-items:center; justify-content:center; flex-direction:column;
}
.scan-modal.show { display:flex; }
.scan-modal video { width:100%; max-width:400px; border-radius:8px; background:#000; }
.scan-modal .scan-tip { color:#fff; font-size:13.5px; margin:16px 0; text-align:center; }
.scan-modal .scan-close {
  padding:10px 30px; background:#fff; color:#222; border:none; border-radius:5px;
  font-size:13.5px; cursor:pointer; font-weight:600; font-family:inherit;
}
.scan-modal canvas { display:none; }

@media (max-width:820px) {
  .login-window { max-width:440px; min-height:0; }
  .brand-side { display:none; }
}
@media (max-width:480px) {
  body { padding:14px; }
  .form-side .fs-body { padding:16px 18px 20px; }
  .footer-links { padding:12px 18px 16px; }
}
</style>
</head>
<body>

<div class="login-window">
  <!-- 左侧品牌区 -->
  <div class="brand-side">
    <div class="brand-logo">梓</div>
    <h1>梓睿聊天</h1>
    <p>连接多端<br>聊天、群组与公共频道</p>
    <div class="brand-foot">
      登录后可在「设置 → 账号与安全」中<br>修改昵称、密码与管理登录设备
    </div>
  </div>

  <!-- 右侧表单区 -->
  <div class="form-side">
    <div class="fs-head">
      <span class="fs-title">登录</span>
      <span class="fs-spacer"></span>
      <button class="theme-toggle" id="themeBtn" title="切换深色模式">🌙</button>
    </div>

    <div class="fs-body">
      <div class="connection-status" id="connectionStatus">
        <span class="dot checking" id="statusDot"></span>
        <span id="statusText">正在检测服务器连接...</span>
      </div>

      <!-- 本机已有登录 -->
      <div class="existing-session" id="existingSession">
        <div class="es-line">检测到本机登录：<b id="existingName">-</b></div>
        <button id="continueBtn">直接进入聊天</button>
      </div>

      <div class="msg" id="msg"></div>

      <div class="tabs">
        <button class="tab active" data-tab="login">登录</button>
        <button class="tab" data-tab="register">注册</button>
      </div>

      <!-- 登录面板 -->
      <div class="form-panel active" id="panelLogin">
        <form id="loginForm">
          <div class="form-group">
            <label for="loginAccount">用户名 / 邮箱</label>
            <input type="text" id="loginAccount" placeholder="请输入用户名或邮箱" autocomplete="username" required />
          </div>
          <div class="form-group">
            <label for="loginPassword">密码</label>
            <div class="password-wrapper">
              <input type="password" id="loginPassword" placeholder="请输入密码" autocomplete="current-password" required />
              <button type="button" class="toggle-password" id="toggleLoginPassword">👁️</button>
            </div>
          </div>
          <div class="form-group">
            <div style="display:flex;align-items:center;gap:8px;">
              <input type="checkbox" id="rememberMe" checked style="width:17px;height:17px;cursor:pointer;accent-color:var(--brand);" />
              <label for="rememberMe" style="margin-bottom:0;font-weight:400;cursor:pointer;font-size:13.5px;">记住我（7天）</label>
            </div>
          </div>
          <button type="submit" class="btn-primary" id="loginBtn">登 录</button>
        </form>

        <div class="social-divider">或</div>
        <button class="btn-secondary" id="syncBtn" style="margin-bottom:10px;">🔄 同步主页登录</button>
        <button class="btn-secondary" id="scanBtn">📷 扫码登录</button>
      </div>

      <!-- 注册面板 -->
      <div class="form-panel" id="panelRegister">
        <form id="registerForm">
          <div class="form-group">
            <label for="regAccount">用户名</label>
            <input type="text" id="regAccount" placeholder="请设置用户名（字母或数字）" required />
          </div>
          <div class="form-group">
            <label for="regEmail">邮箱</label>
            <input type="email" id="regEmail" placeholder="请输入邮箱" required />
          </div>
          <div class="form-group">
            <label for="regPassword">密码</label>
            <div class="password-wrapper">
              <input type="password" id="regPassword" placeholder="请设置密码（至少6位）" required minlength="6" />
              <button type="button" class="toggle-password" id="toggleRegPassword">👁️</button>
            </div>
          </div>
          <div class="form-group">
            <label for="regConfirm">确认密码</label>
            <div class="password-wrapper">
              <input type="password" id="regConfirm" placeholder="请再次输入密码" required minlength="6" />
              <button type="button" class="toggle-password" id="toggleRegConfirm">👁️</button>
            </div>
          </div>
          <button type="submit" class="btn-primary" id="regBtn">注 册</button>
        </form>
      </div>
    </div>

    <div class="footer-links">
      <a href="index.html">返回首页</a>
      <a href="user.html">用户中心</a>
    </div>
  </div>
</div>

<!-- 扫码弹层 -->
<div class="scan-modal" id="scanModal">
  <video id="scanVideo" playsinline></video>
  <canvas id="scanCanvas"></canvas>
  <div class="scan-tip" id="scanTip">将二维码对准摄像头</div>
  <button class="scan-close" id="scanClose">取消</button>
</div>

<script>
// ============================================================
// 配置
// ============================================================
var API_BASE = 'https://webcloud.ziruicloud.de5.net';
var CHAT_URL = 'index.html?user=';

// ============================================================
// DOM
// ============================================================
var $ = function(id) { return document.getElementById(id); };
var msgEl = $('msg');
var statusDot = $('statusDot');
var statusText = $('statusText');

// ============================================================
// Cookie 工具（与主页保持一致）
// ============================================================
var CookieHelper = {
  set: function(name, value, days) {
    var expires = '';
    if (days) {
      var date = new Date();
      date.setTime(date.getTime() + (days * 24 * 60 * 60 * 1000));
      expires = '; expires=' + date.toUTCString();
    }
    document.cookie = name + '=' + encodeURIComponent(value) + expires + '; path=/; SameSite=Lax';
  },
  get: function(name) {
    var nameEQ = name + '=';
    var ca = document.cookie.split(';');
    for (var i = 0; i < ca.length; i++) {
      var c = ca[i];
      while (c.charAt(0) === ' ') c = c.substring(1, c.length);
      if (c.indexOf(nameEQ) === 0) return decodeURIComponent(c.substring(nameEQ.length));
    }
    return null;
  },
  del: function(name) {
    document.cookie = name + '=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;';
  }
};

// ============================================================
// 主题（与聊天页设置共用 chat_settings）
// ============================================================
function resolvedTheme(theme) {
  if (theme === 'system') {
    return (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
  }
  return theme === 'dark' ? 'dark' : 'light';
}
function currentThemeSetting() {
  var s = null;
  try { s = JSON.parse(localStorage.getItem('chat_settings') || 'null'); } catch (e) {}
  if (s && s.theme) return s.theme;
  return localStorage.getItem('theme') || 'light';
}
function applyTheme(theme) {
  document.documentElement.setAttribute('data-theme', resolvedTheme(theme));
  $('themeBtn').textContent = resolvedTheme(theme) === 'dark' ? '☀️' : '🌙';
}
function toggleTheme() {
  var next = resolvedTheme(currentThemeSetting()) === 'dark' ? 'light' : 'dark';
  try {
    localStorage.setItem('theme', next);
    var s = null;
    try { s = JSON.parse(localStorage.getItem('chat_settings') || 'null'); } catch (e) {}
    s = s && typeof s === 'object' ? s : {};
    s.theme = next;
    localStorage.setItem('chat_settings', JSON.stringify(s));
  } catch (e) {}
  applyTheme(next);
}

// ============================================================
// 提示
// ============================================================
function showError(title, detail) {
  msgEl.innerHTML = '<strong>❌ ' + title + '</strong><br>' + (detail || '');
  msgEl.className = 'msg error';
}
function showSuccess(text) { msgEl.textContent = text; msgEl.className = 'msg success'; }
function showInfo(text) { msgEl.textContent = text; msgEl.className = 'msg info'; }
function showWarning(text) { msgEl.textContent = '⚠️ ' + text; msgEl.className = 'msg warning'; }
function hideMsg() { msgEl.className = 'msg'; msgEl.innerHTML = ''; }

// ============================================================
// 写入登录态
// ============================================================
function saveSession(token, user, remember) {
  var displayName = user.username || (user.email ? user.email.split('@')[0] : '用户');
  var userId = user.id || '';

  sessionStorage.setItem('isLoggedIn', 'true');
  sessionStorage.setItem('auth_token', token);
  sessionStorage.setItem('user_data', JSON.stringify(user));
  sessionStorage.setItem('userId', userId);
  sessionStorage.setItem('userEmail', user.email || '');
  sessionStorage.setItem('displayName', displayName);
  sessionStorage.setItem('role', user.role || 'user');

  var days = remember ? 7 : null;
  CookieHelper.set('auth_token', token, days);
  CookieHelper.set('user_data', JSON.stringify(user), days);
  CookieHelper.set('isLoggedIn', 'true', days);
  CookieHelper.set('userId', userId, days);
  CookieHelper.set('userEmail', user.email || '', days);
  CookieHelper.set('displayName', displayName, days);
  CookieHelper.set('role', user.role || 'user', days);
}

// ============================================================
// 连接检测
// ============================================================
async function checkConnection() {
  statusDot.className = 'dot checking';
  statusText.textContent = '正在检测服务器连接...';
  try {
    var r = await fetch(API_BASE + '/health', { signal: AbortSignal.timeout(5000) });
    if (r.ok) {
      statusDot.className = 'dot online';
      statusText.textContent = '✅ 服务器连接正常';
    } else {
      statusDot.className = 'dot offline';
      statusText.textContent = '⚠️ 服务器响应异常 (' + r.status + ')';
    }
  } catch (e) {
    statusDot.className = 'dot offline';
    statusText.textContent = '❌ 无法连接服务器';
  }
}

// ============================================================
// Tab 切换
// ============================================================
document.querySelectorAll('.tab').forEach(function(tab) {
  tab.addEventListener('click', function() {
    document.querySelectorAll('.tab').forEach(function(t) { t.classList.remove('active'); });
    this.classList.add('active');
    var target = this.dataset.tab;
    document.querySelectorAll('.form-panel').forEach(function(p) { p.classList.remove('active'); });
    $('panel' + target.charAt(0).toUpperCase() + target.slice(1)).classList.add('active');
    hideMsg();
  });
});

// ============================================================
// 密码显隐
// ============================================================
function bindToggle(inputId, btnId) {
  var input = $(inputId), btn = $(btnId);
  if (!input || !btn) return;
  btn.addEventListener('click', function() {
    var isPwd = input.getAttribute('type') === 'password';
    input.setAttribute('type', isPwd ? 'text' : 'password');
    btn.textContent = isPwd ? '🙈' : '👁️';
  });
}
bindToggle('loginPassword', 'toggleLoginPassword');
bindToggle('regPassword', 'toggleRegPassword');
bindToggle('regConfirm', 'toggleRegConfirm');

// ============================================================
// 登录
// ============================================================
$('loginForm').addEventListener('submit', async function(e) {
  e.preventDefault();
  hideMsg();
  var account = $('loginAccount').value.trim();
  var password = $('loginPassword').value.trim();
  var remember = $('rememberMe').checked;

  if (!account || !password) { showError('信息不完整', '请填写用户名和密码'); return; }

  var btn = $('loginBtn');
  btn.disabled = true; btn.textContent = '登录中...';

  try {
    var r = await fetch(API_BASE + '/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ account: account, password: password })
    });
    var data = await r.json();

    if (r.status === 200 && data.success) {
      saveSession(data.token, data.user, remember);
      showSuccess('✅ 登录成功，正在进入聊天...');
      setTimeout(function() { location.href = CHAT_URL; }, 900);
    } else {
      showError('登录失败', data.error || '用户名或密码错误');
    }
  } catch (err) {
    showError('网络错误', err.message);
  }
  btn.disabled = false; btn.textContent = '登 录';
});

// ============================================================
// 注册
// ============================================================
$('registerForm').addEventListener('submit', async function(e) {
  e.preventDefault();
  hideMsg();
  var username = $('regAccount').value.trim();
  var email = $('regEmail').value.trim();
  var password = $('regPassword').value.trim();
  var confirm = $('regConfirm').value.trim();

  if (!username || !email || !password || !confirm) { showError('信息不完整', '请填写所有字段'); return; }
  if (username.length < 2) { showError('用户名无效', '用户名至少 2 个字符'); return; }
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { showError('邮箱格式错误', '请输入有效的邮箱'); return; }
  if (password.length < 6) { showError('密码太短', '密码不能少于 6 位'); return; }
  if (password !== confirm) { showError('密码不匹配', '两次输入的密码不一致'); return; }

  var btn = $('regBtn');
  btn.disabled = true; btn.textContent = '注册中...';

  try {
    var r = await fetch(API_BASE + '/api/register', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: username, email: email, password: password })
    });
    var data = await r.json();

    if (r.status === 201 && data.success) {
      saveSession(data.token, data.user, true);
      showSuccess('✅ 注册成功，正在进入聊天...');
      setTimeout(function() { location.href = CHAT_URL; }, 900);
    } else {
      showError('注册失败', data.error || '未知错误');
    }
  } catch (err) {
    showError('网络错误', err.message);
  }
  btn.disabled = false; btn.textContent = '注 册';
});

// ============================================================
// 同步主页登录
// ============================================================
function syncMainLogin() {
  var userId = CookieHelper.get('userId');
  var token = CookieHelper.get('auth_token');

  if (!userId) {
    showWarning('本机没有检测到主页登录信息，请先登录主页，或用账号密码登录');
    return;
  }

  showInfo('检测到本机登录信息，正在校验...');

  if (!token) {
    showSuccess('✅ 已同步本机登录，正在进入聊天...');
    setTimeout(function() { location.href = CHAT_URL; }, 700);
    return;
  }

  fetch(API_BASE + '/api/verify', { headers: { 'Authorization': 'Bearer ' + token } })
    .then(function(r) { return r.json(); })
    .then(function(data) {
      if (data.valid) {
        showSuccess('✅ 已同步本机登录，正在进入聊天...');
        setTimeout(function() { location.href = CHAT_URL; }, 700);
      } else {
        showError('同步失败', '本机登录已过期，请重新登录');
      }
    })
    .catch(function() {
      showError('校验失败', '无法连接服务器');
    });
}
$('syncBtn').addEventListener('click', syncMainLogin);

// ============================================================
// 扫码登录
// ============================================================
var scanStream = null;
var scanRafId = null;

function openScan() {
  var modal = $('scanModal');
  modal.classList.add('show');
  $('scanTip').textContent = '将二维码对准摄像头';
  startCamera();
}

function closeScan() {
  var modal = $('scanModal');
  modal.classList.remove('show');
  if (scanStream) {
    scanStream.getTracks().forEach(function(t) { t.stop(); });
    scanStream = null;
  }
  if (scanRafId) { cancelAnimationFrame(scanRafId); scanRafId = null; }
}

async function startCamera() {
  var video = $('scanVideo');
  var canvas = $('scanCanvas');

  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    $('scanTip').textContent = '当前浏览器不支持摄像头';
    return;
  }

  try {
    scanStream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'environment' }
    });
    video.srcObject = scanStream;
    video.setAttribute('playsinline', 'true');
    await video.play();

    var ctx = canvas.getContext('2d');

    function tick() {
      if (video.readyState === video.HAVE_ENOUGH_DATA) {
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        var imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        var code = jsQR(imgData.data, canvas.width, canvas.height);

        if (code && code.data) {
          handleScanResult(code.data);
          return;
        }
      }
      scanRafId = requestAnimationFrame(tick);
    }
    tick();

  } catch (err) {
    $('scanTip').textContent = '无法打开摄像头：' + err.message;
  }
}

function handleScanResult(text) {
  closeScan();

  // 约定二维码格式： zirui-login://<userId>.<expiresAt>.<nickname>
  var m = text.match(/^zirui-login:\/\/(.+?)\.(\d+)\.(.*)$/);
  if (!m) {
    showError('二维码无效', '不是有效的登录码');
    return;
  }

  var userId = m[1];
  var expiresAt = parseInt(m[2], 10);
  var nickname = decodeURIComponent(m[3] || '');

  if (Date.now() > expiresAt) {
    showError('二维码已过期', '请刷新后重新扫码');
    return;
  }

  CookieHelper.set('userId', userId, 7);
  CookieHelper.set('displayName', nickname || userId, 7);
  CookieHelper.set('isLoggedIn', 'true', 7);
  showSuccess('✅ 扫码成功，正在进入聊天...');
  setTimeout(function() { location.href = CHAT_URL; }, 800);
}

$('scanBtn').addEventListener('click', openScan);
$('scanClose').addEventListener('click', closeScan);

document.addEventListener('DOMContentLoaded', function() {
  applyTheme(currentThemeSetting());
  $('themeBtn').addEventListener('click', toggleTheme);

  checkConnection();

  var userId = CookieHelper.get('userId');
  if (userId) {
    $('existingSession').style.display = 'block';
    $('existingName').textContent = CookieHelper.get('displayName') || userId;
    $('continueBtn').addEventListener('click', function() {
      location.href = CHAT_URL;
    });
  }
});
