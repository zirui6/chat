<!DOCTYPE html>
<html lang="zh-CN" id="htmlRoot">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>梓睿聊天</title>
    <link rel="stylesheet" href="chat.css" />
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
</head>
<body>

    <div class="chat-app" id="app">

        <!-- ===== 左侧：好友列表 ===== -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <span>💬</span>
                    <span>梓睿聊天</span>
                </div>
                <button class="btn-icon" id="settingsBtn" title="设置">⚙</button>
            </div>

            <!-- 个人信息 -->
            <div class="profile" id="profile">
                <img id="myAvatar" src="https://zirui6.github.io/touxiang.jpg" alt="头像" />
                <div class="profile-info">
                    <div class="name" id="myName">加载中...</div>
                    <div class="status" id="myStatus">在线</div>
                </div>
                <button class="btn-icon" id="qrBtn" title="我的二维码">📱</button>
            </div>

            <!-- 搜索好友 -->
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="🔍 搜索好友或添加用户..." />
                <button class="btn-icon" id="addFriendBtn" title="添加好友">➕</button>
            </div>

            <!-- 好友请求 -->
            <div class="friend-requests" id="friendRequests" style="display:none;">
                <div class="requests-title">📩 好友请求</div>
                <div id="requestsList"></div>
            </div>

            <!-- 好友列表 -->
            <div class="friend-list" id="friendList">
                <div class="loading-text">加载好友中...</div>
            </div>

            <!-- 底部 -->
            <div class="sidebar-footer">
                <a href="https://zirui6.github.io" target="_blank">梓睿官网</a>
                <span>|</span>
                <a href="https://zirui6.github.io/user.html" target="_blank">用户中心</a>
            </div>
        </aside>

        <!-- ===== 右侧：聊天窗口 ===== -->
        <main class="chat-window" id="chatWindow">
            <!-- 未选择好友 -->
            <div class="empty-state" id="emptyState">
                <div class="empty-icon">💬</div>
                <h3>选择好友开始聊天</h3>
                <p>点击左侧好友列表中的用户</p>
            </div>

            <!-- 聊天头部 -->
            <div class="chat-header" id="chatHeader" style="display:none;">
                <div class="chat-user">
                    <img id="chatAvatar" src="https://zirui6.github.io/touxiang.jpg" alt="" />
                    <div>
                        <div class="chat-name" id="chatName">用户</div>
                        <div class="chat-status" id="chatStatus">在线</div>
                    </div>
                </div>
                <div class="chat-actions">
                    <button class="btn-icon" id="chatFilesBtn" title="文件">📁</button>
                    <button class="btn-icon" id="chatMoreBtn" title="更多">⋯</button>
                </div>
            </div>

            <!-- 消息列表 -->
            <div class="message-list" id="messageList">
                <!-- 消息由 JS 动态渲染 -->
            </div>

            <!-- 输入区 -->
            <div class="chat-input" id="chatInput" style="display:none;">
                <div class="input-tools">
                    <button class="btn-icon" id="emojiBtn" title="表情">😊</button>
                    <button class="btn-icon" id="fileBtn" title="发送文件">📎</button>
                    <button class="btn-icon" id="imageBtn" title="发送图片">🖼️</button>
                    <input type="file" id="fileInput" accept="*/*" style="display:none;" />
                    <input type="file" id="imageInput" accept="image/*" style="display:none;" />
                </div>
                <div class="input-area">
                    <textarea id="messageInput" rows="1" placeholder="输入消息..." maxlength="10000"></textarea>
                    <button class="btn-send" id="sendBtn">发送</button>
                </div>
            </div>
        </main>

    </div>

    <!-- ===== 二维码弹窗 ===== -->
    <div class="modal-overlay" id="qrModal" style="display:none;">
        <div class="modal">
            <div class="modal-header">
                <h3>📱 我的二维码</h3>
                <button class="modal-close" id="qrModalClose">✕</button>
            </div>
            <div class="modal-body" style="text-align:center;">
                <div id="qrcode"></div>
                <p style="margin-top:12px;font-size:13px;color:var(--text-muted);">
                    用户ID: <strong id="qrUserId">加载中...</strong>
                </p>
                <button class="btn-copy" id="copyIdBtn">📋 复制ID</button>
            </div>
        </div>
    </div>

    <!-- ===== 添加好友弹窗 ===== -->
    <div class="modal-overlay" id="addFriendModal" style="display:none;">
        <div class="modal">
            <div class="modal-header">
                <h3>➕ 添加好友</h3>
                <button class="modal-close" id="addFriendModalClose">✕</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label>输入用户ID 或 用户名</label>
                    <input type="text" id="addFriendInput" placeholder="请输入用户ID或用户名" />
                </div>
                <div class="form-group">
                    <label>验证消息（选填）</label>
                    <input type="text" id="addFriendMsg" placeholder="你好，加个好友吧！" />
                </div>
                <button class="btn-primary" id="addFriendSubmit">发送好友请求</button>
                <div id="searchResults" style="margin-top:12px;"></div>
            </div>
        </div>
    </div>

    <script src="chat.js"></script>
</body>
</html>
